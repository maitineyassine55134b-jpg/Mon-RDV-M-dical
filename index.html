@keyframes up{from{transform:translateY(40px);opacity:.4}}
.msh h2{font:800 17px Montserrat,Arial,sans-serif;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.msh .fld{margin:8px 0}.msh .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font:600 12px Montserrat,Arial,sans-serif}.msh .kv span{color:#666}
.msh select,.msh .fld select{border:0;outline:0;background:none;font:500 13px 'Open Sans';flex:1}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font:600 13px Montserrat,Arial,sans-serif}.tg input{width:42px;height:24px;accent-color:var(--blue)}
.faq{border-bottom:1px solid #eee;padding:8px 0;font:600 12px/1.4 Montserrat,Arial,sans-serif}.faq summary{cursor:pointer;font-weight:800}.faq p{margin-top:4px;font-weight:500;color:#444}
#drw{position:absolute;inset:0;z-index:15;display:none;background:#0005}#drw.on{display:block}
#drw nav{width:78%;height:100%;background:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 20px;display:flex;flex-direction:column;gap:4px;animation:sl .22s}
@keyframes sl{from{transform:translateX(-30px);opacity:.3}}
#drw nav .top2{text-align:center;color:var(--blue);padding-bottom:12px;border-bottom:1px solid #eee;margin-bottom:8px}
#drw nav button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;font:700 14px Montserrat,Arial,sans-serif;text-align:left}#drw nav button:active,#drw nav button:hover{background:#eaf6fd}#drw nav .i{color:var(--blue)}
#drw nav .lo{margin-top:auto;color:#e00000}#drw nav .lo .i{color:#e00000}
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#111e;color:#fff;font:600 12px Montserrat,Arial,sans-serif;padding:10px 16px;border-radius:20px;z-index:30;max-width:86%;text-align:center;display:none}#toast.on{display:block}
.spin{width:16px;height:16px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.leaflet-container{font-family:Montserrat,sans-serif}.leaflet-popup-content{font:600 11px Montserrat,Arial,sans-serif;margin:8px 10px}.leaflet-popup-content a{color:var(--blue);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips span,.chips a{display:flex;align-items:center;gap:5px;background:#fff;border-radius:16px;padding:5px 10px;font:700 10px Montserrat,Arial,sans-serif;color:#1b5e86;text-decoration:none;box-shadow:0 1px 3px #0001}.chips .i{width:14px;height:14px;color:var(--blue)}
.cty{font-weight:500;color:#8a94a3}.mt{display:flex;justify-content:center;align-items:center;gap:12px;margin:4px 18px}.loc{display:flex;align-items:center;gap:4px;font-size:11px}.loc .i{width:15px;height:15px}
.hdr.bar h1{color:#fff}.hdr.bar .ib.dk{color:#1d4a63}
/* --- finitions : contraste et lisibilité --- */
.hdr.bar,.hdr.green{text-shadow:0 1px 2px #0002}
.hdr.bar{background:linear-gradient(180deg,#4fbdf0 0%,#86d4f7 55%,#cdeefc 100%)}
.hdr.bar .ib.dk{color:#16425c;text-shadow:none}
.tabs button.on{background:var(--blue);color:#fff}
.btn{background:#26a9ea}.btn.blue{background:var(--blue)}.btn.navy{background:var(--navy)}.btn.ok{background:var(--green)}
.btn.soft{background:#e1f5e9}.btn.info{background:#dff2fd}.btn.gray{background:#e6e6e6}.btn.pink{background:#ffe1e1}.btn.ghost{background:#fff}
.act .btn{background:#26a9ea}
.sheet .back{color:#1d4a63}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 28px 24px}.ng .btn{font-size:11.5px;padding:11px 6px;margin:4px 0 0}

function ics(a){const p=prov(a.pid),s=a.date.replace(/-/g,'')+'T'+a.time.replace(':','')+'00',e=new Date(a.date+'T'+a.time);e.setMinutes(e.getMinutes()+30);const en=`${iso(e).replace(/-/g,'')}T${pad2(e.getHours())}${pad2(e.getMinutes())}00`;
 const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mon RDV Medical//FR','BEGIN:VEVENT',`UID:${a.id}@mon-rdv-medical`,`DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,'')}`,`DTSTART:${s}`,`DTEND:${en}`,`SUMMARY:RDV ${p.n} (${p.s})`,`LOCATION:${p.addr}`,`DESCRIPTION:Référence ${a.ref}`,'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Rappel de rendez-vous','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');dl(new Blob([t],{type:'text/calendar'}),`rdv-${a.ref}.ics`)}

function pdf(a){const p=prov(a.pid);if(!window.jspdf){return printReceipt(a,p)}const{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a5'});d.setFillColor(0,159,227);d.rect(0,0,148,28,'F');d.setTextColor(255);d.setFontSize(18);d.setFont('helvetica','bold');d.text('Mon RDV Médical',10,14);d.setFontSize(10);d.setFont('helvetica','normal');d.text('Reçu de rendez-vous',10,21);
 d.setTextColor(20);let y=42;const row=(k,v)=>{d.setFont('helvetica','bold');d.text(k,10,y);d.setFont('helvetica','normal');d.text(String(v),55,y,{maxWidth:80});y+=9};
 row('Référence',a.ref);row('Patient',a.patient.name);row('Téléphone',a.patient.phone);row('Médecin / Cabinet',(p.t=='doc'?'Dr. ':'')+p.n);row('Spécialité',p.s);row('Date',fmtDate(a.date));row('Heure',a.time);row('Lieu',p.addr);row('Paiement',({card:'Carte bancaire',mobile:'Mobile Money',bank:'Virement'})[a.method]+(a.paid?'':' (en attente)'));
 d.setDrawColor(0,159,227);d.line(10,y,138,y);y+=10;d.setFontSize(14);d.setFont('helvetica','bold');d.text(`Total : ${a.price} MAD`,10,y);d.setFontSize(8);d.setFont('helvetica','normal');d.setTextColor(110);d.text('Parce que vous êtes au cœur de tout, nous avons rapproché la guérison.',10,190);d.save(`recu-${a.ref}.pdf`)}
function printReceipt(a,p){const w=window.open('','_blank');if(!w)return toast('Autorisez les fenêtres pour imprimer le reçu');w.document.write(`<title>Reçu ${a.ref}</title><body style="font:15px Montserrat,Arial;padding:30px"><h1 style="color:#009fe3">Mon RDV Médical</h1><h3>Reçu de rendez-vous</h3><p>Réf. <b>${a.ref}</b><br>Patient : ${esc(a.patient.name)}<br>${p.t=='doc'?'Dr. ':''}${esc(p.n)} — ${esc(p.s)}<br>${fmtDate(a.date)} à ${a.time}<br>${esc(p.addr)}</p><h2>Total : ${a.price} MAD</h2>`);w.document.close();w.print()}

 $('#mf').onsubmit=async e=>{e.preventDefault();clearErr();const np=$('#np').value;let u;

function resize(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;c.getContext('2d').drawImage(im,x,y,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>toast('Image illisible');im.src=r.result};r.readAsDataURL(file)}

let lastSeen=Date.now();
function setBadge(){const n=unread(),b=$('.hdr.home [data-go="notifs"]');if(!b)return;let x=b.querySelector('.badge');if(n){if(!x){x=document.createElement('span');x.className='badge';b.appendChild(x)}x.textContent=n}else if(x)x.remove()}
function tick(){if(!me())return;const d=D(),n=Date.now(),all=d.notifs.filter(x=>x.at>lastSeen&&x.at<=n),due=all.filter(x=>x.defer);lastSeen=n;if(all.length)setBadge();if(!due.length)return;
